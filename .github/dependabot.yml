version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: "/services/frontend"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/services/gateway"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/services/auth-service"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/services/project-service"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/services/runner-service"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/services/frontend"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/services/gateway"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
