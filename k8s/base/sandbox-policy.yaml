# Sandbox pods get no network at all: no ingress, no egress (not even DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: cloudcode-sandbox
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Cap what a burst of runs (or an abusive user) can consume on the shared node.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: cloudcode-sandbox
spec:
  hard:
    pods: "8"
    limits.cpu: "3"
    limits.memory: 2Gi
