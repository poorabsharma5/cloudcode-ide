apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloudcode
  labels: { app: frontend, part-of: cloudcode }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, part-of: cloudcode }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: cloudcode-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 300m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
---
# The only thing exposed outside the cluster. cloudflared forwards
# ide.poorabsharma.site -> http://localhost:30480
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cloudcode
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30480
